workflows:
  android-workflow:
    name: Android Native Build
    max_build_duration: 60
    instance_type: mac_mini_m1

    environment:
      java: 17
      android_signing:
        - keystore_reference
      vars:
        PACKAGE_NAME: "com.iftechstudio.html_live_editor"

    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Download Gradle wrapper jar
        script: |
          cd android
          mkdir -p gradle/wrapper
          curl -L -o gradle/wrapper/gradle-wrapper.jar \
            https://github.com/gradle/gradle/raw/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew

      - name: Download TextMate grammar files
        script: |
          set -e
          BASE="android/app/src/main/assets/textmate"
          mkdir -p "$BASE/themes"

          # Grammar files from VSCode built-in extensions
          curl -fsSL "https://raw.githubusercontent.com/microsoft/vscode/main/extensions/html/syntaxes/html.tmLanguage.json" \
            -o "$BASE/html.tmLanguage.json"
          curl -fsSL "https://raw.githubusercontent.com/microsoft/vscode/main/extensions/javascript/syntaxes/JavaScript.tmLanguage.json" \
            -o "$BASE/JavaScript.tmLanguage.json"
          curl -fsSL "https://raw.githubusercontent.com/microsoft/vscode/main/extensions/css/syntaxes/css.tmLanguage.json" \
            -o "$BASE/css.tmLanguage.json"

          # Themes from sora-editor demo app
          curl -fsSL "https://raw.githubusercontent.com/Rosemoe/sora-editor/main/app/src/main/assets/textmate/darcula.json" \
            -o "$BASE/themes/darcula.json"
          curl -fsSL "https://raw.githubusercontent.com/Rosemoe/sora-editor/main/app/src/main/assets/textmate/QuietLight.json" \
            -o "$BASE/themes/QuietLight.json"

          echo "Grammar files downloaded:"
          ls -lh "$BASE" "$BASE/themes"

      - name: Build Android Debug APK
        script: |
          cd android
          ./gradlew assembleDebug --build-cache --parallel

      - name: Build Android Release AAB
        script: |
          cd android
          ./gradlew bundleRelease --build-cache --parallel
        ignore_failure: true

    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - android/app/build/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - giftofhope10.tech@gmail.com
        notify:
          success: true
          failure: true
